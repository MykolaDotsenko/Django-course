[project]
name = "cultural-currency-converter"
version = "0.1.0"
description = "Django-first travel-money intelligence application."
readme = "README.md"
requires-python = ">=3.13,<3.15"
authors = [
    { name = "Mykola Dotsenko" },
]
dependencies = [
    "Django==5.2.17",
    "psycopg[binary]==3.3.6",
]

[project.optional-dependencies]
dev = [
    "coverage==7.16.1",
    "pip-audit==2.10.1",
    "playwright==1.63.0",
    "pre-commit==4.6.2",
    "pytest==9.1.1",
    "pytest-django==4.14.0",
    "ruff==0.16.8",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "config*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_tests.py"]
testpaths = ["apps", "config"]
addopts = ["-ra", "--strict-config", "--strict-markers"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["artifacts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.coverage.run]
branch = true
source = ["apps"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
