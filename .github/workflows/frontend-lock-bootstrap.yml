name: Bootstrap frontend lockfile

on:
  push:
    branches:
      - feat/pr2a-frontend-toolchain
    paths:
      - "frontend/**"
      - ".nvmrc"
      - ".github/workflows/frontend-lock-bootstrap.yml"

permissions:
  contents: write

concurrency:
  group: frontend-lock-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    name: Generate and verify npm lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Generate lockfile
        working-directory: frontend
        run: npm install --package-lock-only --no-audit --no-fund

      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Verify frontend toolchain
        working-directory: frontend
        run: npm run quality

      - name: Commit generated lockfile
        shell: bash
        run: |
          if git diff --quiet -- frontend/package-lock.json && git ls-files --error-unmatch frontend/package-lock.json >/dev/null 2>&1; then
            echo "Lockfile already committed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "chore: lock frontend dependencies"
          git push
