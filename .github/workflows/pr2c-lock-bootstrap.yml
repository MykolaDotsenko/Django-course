# Temporary branch-only workflow; removed before PR review.
name: Bootstrap PR2C frontend lockfile

on:
  push:
    branches:
      - feat/pr2c-quiet-atlas-foundations
    paths:
      - "frontend/package.json"
      - ".github/workflows/pr2c-lock-bootstrap.yml"

permissions:
  contents: write

concurrency:
  group: pr2c-lock-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    name: Generate, install and verify lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Generate lockfile
        working-directory: frontend
        run: npm install --package-lock-only --no-audit --no-fund

      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Verify frontend
        working-directory: frontend
        run: npm run quality

      - name: Commit generated lockfile
        shell: bash
        run: |
          if git diff --quiet -- frontend/package-lock.json; then
            echo "Lockfile already matches package.json."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "chore: lock Quiet Atlas font dependency"
          git push
