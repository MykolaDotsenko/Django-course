name: Media preview screenshots

on:
  pull_request:
    paths:
      - "apps/common/**"
      - "templates/**"
      - "config/**"
      - "scripts/capture_media_preview.py"
      - "manage.py"
      - "pyproject.toml"
      - "static/images/quiet-atlas/**"
      - "static/css/quiet-atlas-preview.css"
      - ".github/workflows/media-preview-screenshots.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: media-preview-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Chromium responsive render
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and browser tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Django system check
        run: python manage.py check

      - name: Start preview server
        run: |
          python manage.py runserver 127.0.0.1:8000 --noreload > /tmp/media-preview-server.log 2>&1 &
          echo $! > /tmp/media-preview-server.pid

          python - <<'PY'
          import time
          import urllib.error
          import urllib.request

          url = "http://127.0.0.1:8000/_design/media/"
          deadline = time.time() + 20

          while time.time() < deadline:
              try:
                  with urllib.request.urlopen(url, timeout=2) as response:
                      if response.status == 200:
                          break
              except (urllib.error.URLError, TimeoutError):
                  time.sleep(0.5)
          else:
              raise SystemExit("Django preview server did not become ready")
          PY

      - name: Capture responsive screenshots
        run: python scripts/capture_media_preview.py

      - name: Upload screenshots
        uses: actions/upload-artifact@v7
        with:
          name: quiet-atlas-media-preview
          path: artifacts/media-preview/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Stop preview server
        if: always()
        run: |
          if [ -f /tmp/media-preview-server.pid ]; then
            kill "$(cat /tmp/media-preview-server.pid)" || true
          fi
