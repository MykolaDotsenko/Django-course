name: Format PR5 templates once

on:
  push:
    branches:
      - feat/pr5-htmx-current-conversion
    paths:
      - ".github/workflows/format-pr5-templates-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/pr5-htmx-current-conversion
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Apply canonical djLint formatting
        run: |
          djlint templates/components/converter/current_panel.html \
                 templates/components/converter/picker_dialog.html \
                 templates/pages/converter.html \
                 --reformat || true
      - name: Commit canonical template formatting
        run: |
          if git diff --quiet -- templates; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add templates/components/converter/current_panel.html \
                  templates/components/converter/picker_dialog.html \
                  templates/pages/converter.html
          git commit -m "style: apply canonical djLint formatting to PR5"
          git push origin HEAD:feat/pr5-htmx-current-conversion
