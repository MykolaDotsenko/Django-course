name: Format PR4 Python once

on:
  push:
    branches:
      - feat/pr4-fx-domain-frankfurter
    paths:
      - ".github/workflows/format-pr4-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/pr4-fx-domain-frankfurter
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Apply Ruff formatter
        run: ruff format apps/exchange
      - name: Commit canonical formatting
        run: |
          if git diff --quiet -- apps/exchange; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/exchange
          git commit -m "style: apply canonical Ruff formatting to PR4"
          git push origin HEAD:feat/pr4-fx-domain-frankfurter
