name: Update PR5 frontend lockfile once

on:
  push:
    branches:
      - feat/pr5-htmx-current-conversion
    paths:
      - ".github/workflows/pr5-lockfile-once.yml"

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/pr5-htmx-current-conversion
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install exact combobox navigation dependency
        working-directory: frontend
        run: npm install --save-exact @github/combobox-nav@3.0.2 --ignore-scripts --no-audit --no-fund
      - name: Commit package metadata
        run: |
          if git diff --quiet -- frontend/package.json frontend/package-lock.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json
          git commit -m "build: pin combobox-nav for PR5"
          git push origin HEAD:feat/pr5-htmx-current-conversion
