name: Python quality

on:
  pull_request:
    paths:
      - "apps/**"
      - "config/**"
      - "templates/**"
      - "scripts/**"
      - "manage.py"
      - "pyproject.toml"
      - ".pre-commit-config.yaml"
      - "static/**"
      - ".github/workflows/django-tests.yml"
  push:
    branches:
      - master
    paths:
      - "apps/**"
      - "config/**"
      - "templates/**"
      - "scripts/**"
      - "manage.py"
      - "pyproject.toml"
      - ".pre-commit-config.yaml"
      - "static/**"
      - ".github/workflows/django-tests.yml"

permissions:
  contents: read

concurrency:
  group: python-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      APP_ENV: test
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: testserver,localhost,127.0.0.1
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate pre-commit config
        run: pre-commit validate-config

      - name: Ruff format
        run: ruff format --check apps config scripts manage.py

      - name: Ruff lint
        run: ruff check apps config scripts manage.py

      - name: Django system check
        run: python manage.py check

      - name: Migration drift check
        run: python manage.py makemigrations --check --dry-run

      - name: Tests with branch coverage
        run: |
          coverage erase
          coverage run -m pytest -q
          coverage report

      - name: Dependency audit
        if: matrix.python-version == '3.13'
        run: python -m pip_audit --skip-editable


  postgres:
    name: PostgreSQL 18.6 / Python 3.13
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      APP_ENV: test
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: testserver,localhost,127.0.0.1
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/cultural_currency_test

    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: cultural_currency_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cultural_currency_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify PostgreSQL backend
        run: |
          python manage.py shell -c \
            "from django.db import connection; connection.ensure_connection(); assert connection.vendor == 'postgresql'; print(f'PostgreSQL server: {connection.pg_version}')"

      - name: Django system check
        run: python manage.py check --database default

      - name: Migration drift check
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Test on PostgreSQL
        run: pytest -q
