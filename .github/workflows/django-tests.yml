name: Django checks

on:
  pull_request:
    paths:
      - "apps/**"
      - "config/**"
      - "templates/**"
      - "manage.py"
      - "pyproject.toml"
      - "poetry.lock"
      - "static/**"
      - ".github/workflows/django-tests.yml"
  push:
    branches:
      - master
    paths:
      - "apps/**"
      - "config/**"
      - "templates/**"
      - "manage.py"
      - "pyproject.toml"
      - "poetry.lock"
      - "static/**"
      - ".github/workflows/django-tests.yml"

permissions:
  contents: read

concurrency:
  group: django-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Django / Python 3.13
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            poetry.lock

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "Django>=5.2.1,<6.0.0" \
            "pytest==8.3.5" \
            "pytest-django==4.11.1" \
            "ruff==0.11.10"

      - name: Django system check
        run: python manage.py check

      - name: Ruff
        run: ruff check apps/common

      - name: Pytest
        run: pytest -q
