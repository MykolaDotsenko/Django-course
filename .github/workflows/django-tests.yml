name: Python quality

on:
  pull_request:
    paths:
      - "apps/**"
      - "config/**"
      - "templates/**"
      - "scripts/**"
      - "manage.py"
      - "pyproject.toml"
      - ".pre-commit-config.yaml"
      - "static/**"
      - ".github/workflows/django-tests.yml"
  push:
    branches:
      - master
    paths:
      - "apps/**"
      - "config/**"
      - "templates/**"
      - "scripts/**"
      - "manage.py"
      - "pyproject.toml"
      - ".pre-commit-config.yaml"
      - "static/**"
      - ".github/workflows/django-tests.yml"

permissions:
  contents: read

concurrency:
  group: python-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      APP_ENV: test
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: testserver,localhost,127.0.0.1
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate pre-commit config
        run: pre-commit validate-config

      - name: Ruff format
        run: ruff format --check apps config scripts manage.py

      - name: Ruff lint
        run: ruff check apps config scripts manage.py

      - name: Focused Python typecheck
        if: matrix.python-version == '3.13'
        run: >-
          mypy
          apps/exchange/domain.py
          apps/exchange/providers/base.py
          apps/exchange/providers/frankfurter.py
          config/environment.py
          config/database.py
          config/cache.py
          config/csp.py
          config/ai.py
          integrations/gemini/client.py

      - name: Django template lint
        run: djlint templates --check

      - name: Django system check
        run: python manage.py check

      - name: Migration drift check
        run: python manage.py makemigrations --check --dry-run

      - name: Tests with branch coverage
        run: |
          coverage erase
          coverage run -m pytest -q
          coverage report

      - name: Dependency audit
        if: matrix.python-version == '3.13'
        run: python -m pip_audit --skip-editable

  postgres:
    name: PostgreSQL 18.6 / Python 3.13
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      APP_ENV: test
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: testserver,localhost,127.0.0.1
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/cultural_currency_test
      CACHE_URL: redis://127.0.0.1:6379/0

    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: cultural_currency_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cultural_currency_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8.2.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify PostgreSQL backend
        run: |
          python manage.py shell -c \
            "from django.db import connection; connection.ensure_connection(); assert connection.vendor == 'postgresql'; print(f'PostgreSQL server: {connection.pg_version}')"

      - name: Verify shared Redis cache
        run: |
          python manage.py shell -c "from django.conf import settings; from django.core.cache import cache; assert settings.CACHES['default']['BACKEND'] == 'django.core.cache.backends.redis.RedisCache'; cache.set('ci:shared-cache', 'ok', 30); assert cache.get('ci:shared-cache') == 'ok'; cache.delete('ci:shared-lock'); assert cache.add('ci:shared-lock', 'owner-a', 30) is True; assert cache.add('ci:shared-lock', 'owner-b', 30) is False"

      - name: Django system check
        run: python manage.py check --database default

      - name: Migration drift check
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Production deploy security check
        env:
          APP_ENV: production
          DJANGO_DEBUG: "false"
          DJANGO_ALLOWED_HOSTS: app.example.test
          DJANGO_SECRET_KEY: ci-production-check-7Qv9pL2mN4xR8sT1uW3yZ6aB5cD0eF7gH9jK2mP4
          DJANGO_HTTPS_MODE: proxy
          DJANGO_HSTS_SECONDS: "300"
          DJANGO_HSTS_INCLUDE_SUBDOMAINS: "true"
          DJANGO_HSTS_PRELOAD: "true"
          DJANGO_CSP_MODE: enforce
        run: |
          python manage.py check --deploy --fail-level WARNING
          python manage.py shell -c "from django.conf import settings; from django.test import Client; assert settings.SECURE_SSL_REDIRECT is True; assert settings.SECURE_PROXY_SSL_HEADER == ('HTTP_X_FORWARDED_PROTO', 'https'); assert settings.SECURE_HSTS_SECONDS == 300; assert settings.SESSION_COOKIE_SECURE is True; assert settings.CSRF_COOKIE_SECURE is True; assert settings.CONTENT_SECURITY_POLICY_HEADER == 'Content-Security-Policy'; response = Client(HTTP_HOST='app.example.test', HTTP_X_FORWARDED_PROTO='https').get('/health/live/'); assert response.status_code == 200; policy = response['Content-Security-Policy']; assert \"script-src 'self'\" in policy; assert \"script-src-attr 'none'\" in policy; assert \"object-src 'none'\" in policy; assert \"frame-ancestors 'none'\" in policy"

      - name: Run test suite against PostgreSQL
        run: pytest -q
