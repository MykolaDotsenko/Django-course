repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: ruff format
        language: system
        types: [python]
      - id: django-check
        name: Django system check
        entry: python manage.py check
        language: system
        pass_filenames: false
      - id: djlint-check
        name: Django template format
        entry: djlint templates --check
        language: system
        pass_filenames: false
