<figure class="qa-media" data-media-kind="{{ image.kind }}">
  <div class="qa-media__frame" style="aspect-ratio: {{ image.ratio }};">
    <img class="qa-media__image"
         src="{{ image.src }}"
         {% if image.srcset %}srcset="{{ image.srcset }}" sizes="{{ image.sizes }}"{% endif %}
         alt="{{ image.alt }}"
         width="{{ image.width }}"
         height="{{ image.height }}"
         loading="{{ loading|default:'lazy' }}"
         decoding="async"
         {% if fetchpriority %}fetchpriority="{{ fetchpriority }}"{% endif %}
         {% if image.decorative %}aria-hidden="true"{% endif %}>
  </div>
  {% if caption or image.caption or image.authenticity_label or image.attribution_text %}
    <figcaption class="qa-media__caption">
      {% if caption %}
        <span>{{ caption }}</span>
      {% elif image.caption %}
        <span>{{ image.caption }}</span>
      {% endif %}
      {% if image.authenticity_label %}
        <span class="qa-media__authenticity">{{ image.authenticity_label }}</span>
      {% endif %}
      {% if image.attribution_text %}
        {% if image.source_url %}
          <a class="qa-media__attribution"
             href="{{ image.source_url }}"
             rel="noopener noreferrer">{{ image.attribution_text }}</a>
        {% else %}
          <span class="qa-media__attribution">{{ image.attribution_text }}</span>
        {% endif %}
      {% endif %}
    </figcaption>
  {% endif %}
</figure>
